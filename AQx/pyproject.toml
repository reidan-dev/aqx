[project]
name = "aqx"
version = "0.1.0"
description = "AQx — macOS desktop automation: mouse/keyboard recorder and node-graph editor"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.11",
    "pynput>=1.7",
]

[project.scripts]
aqx = "aqx.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aqx"]
